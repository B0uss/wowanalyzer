name: Outlaw validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - midnight
    paths:
      - 'src/analysis/retail/rogue/outlaw/**'
      - 'src/common/SPELLS/rogue.ts'
      - 'src/common/TALENTS/rogue.ts'
      - 'tsconfig.json'
      - '.oxlintrc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/outlaw-validation.yml'
  push:
    paths:
      - 'src/analysis/retail/rogue/outlaw/**'
      - 'src/common/SPELLS/rogue.ts'
      - 'src/common/TALENTS/rogue.ts'
      - 'tsconfig.json'
      - '.oxlintrc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/outlaw-validation.yml'

permissions:
  contents: read

concurrency:
  group: outlaw-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test Outlaw
        run: pnpm exec vitest run src/analysis/retail/rogue/outlaw

      - name: Build
        run: pnpm run build
